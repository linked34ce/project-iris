name: Unity CI (EditMode + Coverage gate)

on:
  pull_request:
    branches: [main, develop]

jobs:
  test-editmode:
    runs-on: ubuntu-latest

    env:
      UNITY_VERSION: 6000.2.1f1
      COVERAGE_THRESHOLD: "90"
      ASSEMBLY_FILTERS: "+ScriptsAssembly"

    steps:
      - uses: actions/checkout@v4

      - name: Run EditMode Tests with Coverage
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: editmode
          coverageOptions: >
            generateHtmlReport;
            generateBadgeReport;
            assemblyFilters:${{ env.ASSEMBLY_FILTERS }}
          customParameters: >
            -logFile - -stackTraceLogType Full
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce coverage threshold
        shell: bash
        run: |
          set -euo pipefail

          echo "== Locate Summary.xml =="
          SUMMARY="$(find "$GITHUB_WORKSPACE" -type f -name 'Summary.xml' -path '*/CodeCoverage/*' | head -n1 || true)"
          if [[ -z "${SUMMARY}" ]]; then
            echo "::error::Coverage Summary.xml not found"
            find "$GITHUB_WORKSPACE" -type f -pasth '*/CodeCoverage/*' | sed 's/^/  - /' || true
            exit 2
          fi
          echo "Summary.xml: ${SUMMARY}"

          echo "== Assemblies included (from Summary.xml) =="

          grep -oE '<Assembly name="[^"]+"' "$SUMMARY" | sed -E 's/.*name="([^"]+)".*/  - \1/' | sort -u || true

          echo "== Parse line coverage =="

          LINE="$(grep -oE '<Linecoverage>[0-9.]+</Linecoverage>' "$SUMMARY" | grep -oE '[0-9.]+' || true)"

          if [[ -z "${LINE}" ]]; then
            LINE="$(grep -oE 'LineCoverageInfo percent="([0-9.]+)"' "$SUMMARY" | grep -oE '[0-9.]+' || true)"
          fi

          if [[ -z "${LINE}" ]]; then
            echo "::error::Failed to parse line coverage from Summary.xml"
            sed -n '1,150p' "$SUMMARY" || true
            exit 3
          fi

          echo "Line coverage: ${LINE}% (threshold ${COVERAGE_THRESHOLD}%)"
          awk -v l="${LINE}" -v t="${COVERAGE_THRESHOLD}" 'BEGIN{exit (l>=t)?0:1}' || {
            echo "::error::Coverage ${LINE}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          }

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            **/CodeCoverage/**

      - name: Upload Editor.log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-log
          path: |
            ~/.config/unity3d/Editor.log
            ~/.local/share/unity3d/Editor/Editor.log
            **/Editor.log
