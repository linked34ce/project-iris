name: Unity CI (EditMode + Coverage gate)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  test-editmode:
    runs-on: ubuntu-latest

    env:
      UNITY_VERSION: 6000.2.1f1
      COVERAGE_THRESHOLD: "90"
      ASSEMBLY_FILTERS: "+ScriptsAssembly"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run EditMode Tests with Coverage
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: editmode
          coverageOptions: >
            generateHtmlReport;
            generateHtmlReportHistory;
            generateAdditionalReports;
            generateBadgeReport;
            generateAdditionalMetrics;
            generateTestReferences;
            assemblyFilters:${{ env.ASSEMBLY_FILTERS }};
          customParameters: >
            -logFile - -stackTraceLogType Full
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate HTML & badge via ReportGenerator
        uses: danielpalme/ReportGenerator-GitHub-Action@5.3.10
        with:
          reports: "${{ github.workspace }}/CodeCoverage/workspace-opencov/**/*.xml"
          targetdir: "public/coverage"
          reporttypes: "Html;Badges;XmlSummary"
          assemblyfilters: "+ScriptsAssembly"
          historydir: "public/coverage/History"
          verbosity: "Info"

      - name: Enforce coverage threshold
        shell: bash
        run: |
          set -euo pipefail

          echo "== Locate Summary.xml =="
          if [[ -f "public/coverage/Summary.xml" ]]; then
            SUMMARY="public/coverage/Summary.xml"
          else
            SUMMARY="$(find "$GITHUB_WORKSPACE" -type f -name 'Summary.xml' -path '*/CodeCoverage/*' | head -n1 || true)"
          fi

          if [[ -z "${SUMMARY}" || ! -f "${SUMMARY}" ]]; then
            echo "::error::Coverage Summary.xml not found"
            exit 2
          fi
          echo "Summary.xml: ${SUMMARY}"

          echo "== Assemblies included (from Summary.xml) =="
          grep -oE '<[Aa]ssembly name="[^"]+"' "$SUMMARY" | sed -E 's/.*name="([^"]+)".*/  - \1/' | sort -u || true

          echo "== Parse line coverage (prefer ScriptsAssembly) =="

          LINE=""

          LINE=$(grep -oE '<[Aa]ssembly name="ScriptsAssembly"[^>]*coverage="[0-9.]+"' "$SUMMARY" | \
                sed -E 's/.*coverage="([0-9.]+)".*/\1/' | head -n1)

          if [[ -z "${LINE}" ]]; then
            LINE=$(grep -oE '<Linecoverage>[0-9.]+' "$SUMMARY" | sed -E 's/.*<Linecoverage>([0-9.]+).*/\1/' | head -n1)
          fi

          if [[ -z "${LINE}" ]]; then
            LINE=$(grep -oE 'linecoverage="[0-9.]+"' "$SUMMARY" | sed -E 's/.*linecoverage="([0-9.]+)".*/\1/' | head -n1)
          fi

          if [[ -z "${LINE}" ]]; then
            echo "::error::Failed to parse line coverage from Summary.xml"
            sed -n '1,150p' "$SUMMARY" || true
            exit 3
          fi

          echo "Line coverage: ${LINE}% (threshold ${COVERAGE_THRESHOLD}%)"
          awk -v l="${LINE}" -v t="${COVERAGE_THRESHOLD}" 'BEGIN{exit (l>=t)?0:1}' || {
            echo "::error::Coverage ${LINE}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          }

      - name: Publish coverage to GitHub Pages
        if: github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          commit_message: "docs: update coverage report & badge [skip ci]"
